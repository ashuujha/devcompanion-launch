name: First-session feedback
description: Tell us whether the companion helped with a real development task.
title: "[First session]: "
body:
  - type: markdown
    attributes:
      value: "Thanks for trying the preview. This report is public. Remove secrets and private code."
  - type: input
    id: setup
    attributes:
      label: Platform and local model
      placeholder: "Linux x86_64, qwen3:4b-instruct-2507-q4_K_M, CPU or GPU"
    validations:
      required: true
  - type: dropdown
    id: activation
    attributes:
      label: How far did you get?
      options:
        - Downloaded but did not run it
        - Installed and started a session
        - Used a session on a real development task
        - Returned for another session
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What were you trying to finish?
      description: A short description is enough; no private code needed.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What helped, and what got in the way?
      description: Include one concrete useful or confusing moment.
    validations:
      required: true

  - type: dropdown
    id: alert-quality
    attributes:
      label: How did the alerts behave?
      options:
        - A useful failure was noticed
        - An explanation was incorrect
        - Repeated or unnecessary interruptions
        - A problem was missed
        - I only tried reminders or setup
  - type: dropdown
    id: return-intent
    attributes:
      label: Would you use it for another work session?
      options:
        - Yes, I already returned
        - Yes, I plan to try again
        - Unsure
        - No
  - type: textarea
    id: counts
    attributes:
      label: Optional aggregate trial report
      description: Paste dot trial report --json if you chose to record a session. This excludes code, paths and private notes. Review before sharing; do not paste a database export.
      render: json
