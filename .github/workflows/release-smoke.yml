name: Public Linux release smoke
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIEW_TAG: ${{ github.event.release.tag_name || 'v0.2.0' }}
    steps:
      - name: Download and verify the public release
        run: |
          PREVIEW_VERSION="${PREVIEW_TAG#v}"
          RELEASE_URL="https://github.com/ashuujha/devcompanion-launch/releases/download/$PREVIEW_TAG"
          PREVIEW_ARCHIVE="devcompanion-$PREVIEW_VERSION-linux-x86_64.tar.gz"
          curl --fail --location "$RELEASE_URL/$PREVIEW_ARCHIVE" --output "$PREVIEW_ARCHIVE"
          curl --fail --location "$RELEASE_URL/SHA256SUMS" --output SHA256SUMS
          sha256sum --check SHA256SUMS
          tar -xzf "$PREVIEW_ARCHIVE"
          "./devcompanion-$PREVIEW_VERSION/devcompanion" --version
          echo "CLI_PATH=$PWD/devcompanion-$PREVIEW_VERSION/devcompanion" >> "$GITHUB_ENV"
      - name: Exercise the published binary on a fresh Git project
        run: |
          export DEVCOMPANION_HOME="$RUNNER_TEMP/companion-state"
          mkdir -p "$RUNNER_TEMP/companion-project"
          cd "$RUNNER_TEMP/companion-project"
          git init -b main
          git config user.name "Release Smoke"
          git config user.email "smoke@example.invalid"
          echo first > note.txt
          git add note.txt
          git commit -m initial
          "$CLI_PATH" init --goal "Verify the published binary"
          "$CLI_PATH" check add smoke -- test -f note.txt
          "$CLI_PATH" verify smoke
          "$CLI_PATH" resume | tee "$RUNNER_TEMP/companion-current.txt"
          grep -F 'CHECK PASSED' "$RUNNER_TEMP/companion-current.txt"
          echo changed > note.txt
          "$CLI_PATH" resume | tee "$RUNNER_TEMP/companion-updated.txt"
          grep -F 'outdated' "$RUNNER_TEMP/companion-updated.txt"
          "$CLI_PATH" privacy
          if [ "$PREVIEW_TAG" = "v0.2.0" ]; then
            "$CLI_PATH" task list
            "$CLI_PATH" --help | grep -F 'work'
          fi
          "$CLI_PATH" forget --yes
          test -f note.txt
