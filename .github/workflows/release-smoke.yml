name: Public Linux release smoke
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_TAG: ${{ github.event.release.tag_name || 'v0.8.2' }}
    steps:
      - name: Download and verify the public release
        run: |
          PREVIEW_VERSION="${PREVIEW_TAG#v}"
          RELEASE_URL="https://github.com/ashuujha/devcompanion-launch/releases/download/$PREVIEW_TAG"
          PREVIEW_ARCHIVE="devcompanion-$PREVIEW_VERSION-linux-x86_64.tar.gz"
          curl --fail --location "$RELEASE_URL/$PREVIEW_ARCHIVE" --output "$PREVIEW_ARCHIVE"
          curl --fail --location "$RELEASE_URL/SHA256SUMS" --output SHA256SUMS
          if [[ "$PREVIEW_TAG" == v0.4.* || "$PREVIEW_TAG" == v0.5.* || "$PREVIEW_TAG" == v0.6.* || "$PREVIEW_TAG" == v0.7.* || "$PREVIEW_TAG" == v0.8.* ]]; then
            curl --fail --location "$RELEASE_URL/dot-developer-companion-0.1.0.vsix" --output dot-developer-companion-0.1.0.vsix
          fi
          sha256sum --check SHA256SUMS
          tar -xzf "$PREVIEW_ARCHIVE"
          "./devcompanion-$PREVIEW_VERSION/devcompanion" --version
          echo "CLI_PATH=$PWD/devcompanion-$PREVIEW_VERSION/devcompanion" >> "$GITHUB_ENV"
      - name: Exercise the published binary on a fresh Git project
        run: |
          export DEVCOMPANION_HOME="$RUNNER_TEMP/companion-state"
          mkdir -p "$RUNNER_TEMP/companion-project"
          cd "$RUNNER_TEMP/companion-project"
          git init -b main
          git config user.name "Release Smoke"
          git config user.email "smoke@example.invalid"
          echo first > note.txt
          git add note.txt
          git commit -m initial
          "$CLI_PATH" init --goal "Verify the published binary"
          "$CLI_PATH" check add smoke -- test -f note.txt
          "$CLI_PATH" verify smoke
          "$CLI_PATH" resume | tee "$RUNNER_TEMP/companion-current.txt"
          grep -F 'CHECK PASSED' "$RUNNER_TEMP/companion-current.txt"
          echo changed > note.txt
          "$CLI_PATH" resume | tee "$RUNNER_TEMP/companion-updated.txt"
          grep -F 'outdated' "$RUNNER_TEMP/companion-updated.txt"
          "$CLI_PATH" privacy
          if [ "$PREVIEW_TAG" != "v0.1.0" ]; then
            "$CLI_PATH" task list
            "$CLI_PATH" --help | grep -F 'work'
          fi
          if [[ "$PREVIEW_TAG" == v0.3.* || "$PREVIEW_TAG" == v0.4.* || "$PREVIEW_TAG" == v0.5.* || "$PREVIEW_TAG" == v0.6.* || "$PREVIEW_TAG" == v0.7.* || "$PREVIEW_TAG" == v0.8.* ]]; then
            "$CLI_PATH" companion --name Pixel --pet buddy --pet-color cocoa --learning off
            "$CLI_PATH" pets
            printf 'dot pet name\ndot companion --name Changed\ndot run -- touch must-not-run\n/quit\n' | "$CLI_PATH" --ollama-url http://127.0.0.1:1 chat | tee "$RUNNER_TEMP/chat-command-guidance.txt"
            grep -F "You're inside chat" "$RUNNER_TEMP/chat-command-guidance.txt"
            grep -F 'buddy' "$RUNNER_TEMP/chat-command-guidance.txt"
            "$CLI_PATH" companion | grep -F 'Pixel'
            test ! -e must-not-run
            "$CLI_PATH" memory add "Keep the smoke check local"
            "$CLI_PATH" memory search smoke
            "$CLI_PATH" resources --device cpu --context 4096
            "$CLI_PATH" integration vscode
            "$CLI_PATH" data export "$RUNNER_TEMP/project-export.json"
            "$CLI_PATH" data backup "$RUNNER_TEMP/state-backup.sqlite3"
            test -s "$RUNNER_TEMP/project-export.json"
            test -s "$RUNNER_TEMP/state-backup.sqlite3"
          fi
          if [[ "$PREVIEW_TAG" == v0.4.* || "$PREVIEW_TAG" == v0.5.* || "$PREVIEW_TAG" == v0.6.* || "$PREVIEW_TAG" == v0.7.* || "$PREVIEW_TAG" == v0.8.* ]]; then
            "$CLI_PATH" presence status --json
            "$CLI_PATH" presence enable
            "$CLI_PATH" remind add --in 20m "Review smoke result"
            "$CLI_PATH" focus 25
            "$CLI_PATH" quiet 0
            printf '%s\n' '{"schema_version":1,"documents":[{"path":"note.txt","version":1,"saved":true,"diagnostics":[{"line":1,"column":1,"severity":"error","message":"Release smoke diagnostic"}]}]}' | "$CLI_PATH" diagnostics ingest --source vscode --replace --stdin
            "$CLI_PATH" incident list --json | tee "$RUNNER_TEMP/incidents.json"
            grep -F 'Release smoke diagnostic' "$RUNNER_TEMP/incidents.json"
            printf '%s\n' '{"schema_version":1,"documents":[]}' | "$CLI_PATH" diagnostics ingest --source vscode --replace --stdin
            "$CLI_PATH" incident list --all --json | grep -F 'cleared'
            "$CLI_PATH" voice status
            "$CLI_PATH" desk --json
            "$CLI_PATH" presence disable
          fi
          if [[ "$PREVIEW_TAG" == v0.5.* || "$PREVIEW_TAG" == v0.6.* || "$PREVIEW_TAG" == v0.7.* || "$PREVIEW_TAG" == v0.8.* ]]; then
            "$CLI_PATH" --ollama-url http://127.0.0.1:1 setup --json | tee "$RUNNER_TEMP/setup.json"
            grep -F '"memory_enabled": true' "$RUNNER_TEMP/setup.json"
            "$CLI_PATH" trial start
            "$CLI_PATH" trial finish neutral
            "$CLI_PATH" trial report --json | tee "$RUNNER_TEMP/trial.json"
            grep -F '"declared_sessions": 1' "$RUNNER_TEMP/trial.json"
            "$CLI_PATH" presence enable
            "$CLI_PATH" --ollama-url http://127.0.0.1:1 proactive enable
            "$CLI_PATH" proactive status --json
            "$CLI_PATH" proactive disable
            "$CLI_PATH" presence disable
            PREVIEW_VERSION="${PREVIEW_TAG#v}"
            "$CLI_PATH" update --check --from-archive "$GITHUB_WORKSPACE/devcompanion-$PREVIEW_VERSION-linux-x86_64.tar.gz" --checksum "$GITHUB_WORKSPACE/SHA256SUMS"
          fi
          if [[ "$PREVIEW_TAG" == v0.6.* || "$PREVIEW_TAG" == v0.7.* || "$PREVIEW_TAG" == v0.8.* ]]; then
            "$CLI_PATH" guard status --json
            "$CLI_PATH" guard setup
            "$CLI_PATH" guard enable
            python3 - <<'PYTEST'
          from pathlib import Path
          Path('synthetic-token.py').write_text('token = "' + 'ghp_' + 'A8xZ3kM9qV5bR2tY6nW4cF7jL0dS1pH5eG9u' + '"\n')
          PYTEST
            git add synthetic-token.py
            if "$CLI_PATH" guard scan --staged --json > "$RUNNER_TEMP/guard-report.json"; then
              echo "Expected a blocked synthetic credential scan" >&2
              exit 1
            fi
            BEFORE_COMMIT=$(git rev-parse HEAD)
            if git commit -m 'Must block synthetic credential' > "$RUNNER_TEMP/guard-commit.txt" 2>&1; then
              echo "Expected the installed pre-commit hook to block" >&2
              exit 1
            fi
            test "$(git rev-parse HEAD)" = "$BEFORE_COMMIT"
            python3 - <<'PYTEST'
          import json, os
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'guard-report.json').read_text()
          report = json.loads(text)
          assert report['known_pattern_findings'] >= 1, report
          assert 'ghp_' + 'A8xZ3kM9qV5bR2tY6nW4cF7jL0dS1pH5eG9u' not in text
          hook_text = (Path(os.environ['RUNNER_TEMP']) / 'guard-commit.txt').read_text()
          assert 'ghp_' + 'A8xZ3kM9qV5bR2tY6nW4cF7jL0dS1pH5eG9u' not in hook_text
          PYTEST
            git reset -- synthetic-token.py
            rm synthetic-token.py
            "$CLI_PATH" guard disable
            "$CLI_PATH" voice chat --help | grep -F -- '--continuous'
          fi
          if [[ "$PREVIEW_TAG" == v0.7.* || "$PREVIEW_TAG" == v0.8.* ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3-gi gir1.2-gtk-3.0 librsvg2-common xvfb
            "$CLI_PATH" desktop check
            python3 - <<'PYTEST'
          import json, os, subprocess
          child = subprocess.Popen([os.environ['CLI_PATH'], '--ollama-url', 'http://127.0.0.1:1', 'desktop', 'serve'], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          for request_id, operation in enumerate(['project.open', 'snapshot'], 1):
              child.stdin.write(json.dumps({'version': 1, 'id': request_id, 'operation': operation, 'params': {'project': os.getcwd()}}) + '\n')
              child.stdin.flush()
              frame = json.loads(child.stdout.readline())
              assert frame['ok'] and frame['id'] == request_id, frame
              assert frame['result']['schema_version'] == 1
              assert not frame['result']['permissions']['cloud']
              assert not frame['result']['permissions']['screens']
          child.stdin.write(json.dumps({'version': 1, 'id': 3, 'operation': 'desktop.preferences', 'params': {'theme': 'night', 'confirm': True}}) + '\n')
          child.stdin.flush()
          frame = json.loads(child.stdout.readline())
          assert frame['ok'] and frame['result']['theme'] == 'night', frame
          child.stdin.write(json.dumps({'version': 1, 'id': 4, 'operation': 'snapshot', 'params': {'project': os.getcwd()}}) + '\n')
          child.stdin.flush()
          frame = json.loads(child.stdout.readline())
          assert frame['ok'] and frame['result']['desktop']['theme'] == 'night', frame
          child.stdin.close()
          assert child.wait(timeout=10) == 0
          PYTEST
            xvfb-run -a python3 - <<'PYTEST'
          import importlib.util, os
          from pathlib import Path
          from types import SimpleNamespace
          from gi.repository import GLib
          frontend = Path.home() / '.local/lib/devcompanion-desktop/companion.py'
          spec = importlib.util.spec_from_file_location('desktop', frontend)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          app = module.Companion(SimpleNamespace(engine=os.environ['CLI_PATH'], endpoint='http://127.0.0.1:1', model=None, project=os.getcwd()))
          observed = []
          def inspect():
              if not app.snapshot:
                  return True
              observed.append(app.snapshot['goals'][0]['text'] == 'Verify the published binary' and app.dot.get_visible() and app.dot_pet.get_pixbuf() is not None and not app.error_text)
              app.quit()
              return False
          GLib.timeout_add(200, inspect)
          GLib.timeout_add_seconds(15, lambda: app.quit() or False)
          app.run(['release-desktop-smoke', os.getcwd()])
          assert observed == [True], observed
          PYTEST
          fi
          "$CLI_PATH" forget --yes
          test -f note.txt
